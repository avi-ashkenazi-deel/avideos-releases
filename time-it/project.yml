# XcodeGen project definition for "Time It".
#
# This file is the source of truth for the Xcode project. The generated
# `TimeIt.xcodeproj` is intentionally NOT committed (see .gitignore).
#
# To generate / regenerate the Xcode project on a Mac:
#
#     brew install xcodegen   # one time
#     xcodegen generate
#     open TimeIt.xcodeproj
#
# Then set your Apple Developer team and (optionally) a unique bundle id
# prefix in Xcode's signing settings before running on device.

name: TimeIt

options:
  bundleIdPrefix: com.aviashkenazi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"   # bump this (in THIS file) for every upload
    DEVELOPMENT_TEAM: "" # <- set your team id here or in Xcode signing.

targets:

  # ---------------------------------------------------------------------------
  # iPhone app
  # ---------------------------------------------------------------------------
  TimeIt:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.timeit
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/TimeIt.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TimeItWatch
        embed: true
      - target: TimeItWidget
        embed: true

  # ---------------------------------------------------------------------------
  # Widget extension: Live Activity (Lock Screen + Dynamic Island).
  # ---------------------------------------------------------------------------
  TimeItWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      # The Live Activity attributes are shared with the app; the widget also
      # needs the color + clock helpers. Compile just those, not all of Shared.
      - path: Shared/LiveActivity/TimerActivityAttributes.swift
      - path: Shared/Services/Color+Hex.swift
      - path: Shared/Models/TimeFormatting.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.timeit.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/TimeItWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  # ---------------------------------------------------------------------------
  # Unit tests for the pure scheduling logic (runnable on macOS via `xcodebuild`).
  # ---------------------------------------------------------------------------
  TimeItTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # Compile just the pure model/engine logic the tests exercise — no UI.
      - path: Shared/Models
      - path: Shared/Engine/MilestoneScheduler.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.timeit.tests
        GENERATE_INFOPLIST_FILE: YES

  # ---------------------------------------------------------------------------
  # Apple Watch app (modern single-target watchOS app)
  # ---------------------------------------------------------------------------
  TimeItWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.timeit.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/TimeItWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Declare schemes explicitly so regenerating the project always keeps a
# runnable scheme for the app (and the watch) — Xcode's auto-created schemes
# don't survive `xcodegen generate`.
schemes:
  TimeIt:
    build:
      targets:
        TimeIt: all
        TimeItTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeItTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TimeItWatch:
    build:
      targets:
        TimeItWatch: all
    run:
      config: Debug
    archive:
      config: Release
