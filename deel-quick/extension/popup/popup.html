<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Deel Quick</h1>
    <p class="tagline">Capture this screen &rarr; iterate with Claude</p>
  </header>

  <main id="form-view">
    <label for="intent">What do you want to improve? <span class="optional">(optional)</span></label>
    <textarea id="intent" rows="3" placeholder="e.g. make the contracts table denser"></textarea>

    <label class="check"><input type="checkbox" id="delay"> Capture after 3s delay (open a menu or hover state first)</label>
    <label class="check"><input type="checkbox" id="downscale"> Downscale large images (smaller file)</label>

    <button id="capture">Capture this screen</button>
    <p id="hint" class="hint"></p>
  </main>

  <main id="progress-view" hidden>
    <div class="phases">
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="phase-label">Starting&hellip;</p>
    </div>
  </main>

  <main id="result-view" hidden>
    <h2 id="result-title">Captured</h2>
    <p id="result-file" class="mono"></p>
    <table id="ledger"></table>
    <ul id="warnings"></ul>
    <p class="hint">A ready-to-paste prompt is on your clipboard. Attach the downloaded file in a Claude chat and paste.</p>
    <div class="row">
      <button id="open-claude">Open claude.ai</button>
      <button id="again" class="secondary">Capture again</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
