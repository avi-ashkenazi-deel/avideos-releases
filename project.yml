# XcodeGen project definition for this repo's apps: streamit (macOS studio)
# and HearIt (the shipped iOS app), which share one generated project.
#
# This file is the source of truth. The generated `Streamit.xcodeproj` is
# intentionally NOT committed (see .gitignore).
#
# To generate / regenerate the Xcode project on a Mac:
#
#     brew install xcodegen   # one time
#     xcodegen generate       # or ./scripts/dev-app-only.sh for a dev build
#     open Streamit.xcodeproj
#
# Then set your Apple Developer team and a unique bundle id prefix in
# Xcode's signing settings (or in Secrets.xcconfig) before running on device.

name: Streamit

options:
  bundleIdPrefix: com.aviashkenazi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  groupSortPosition: top

# Swift-package dependencies (Mac app only; the iOS/watch targets stay dependency-free).
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.6.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  # libASPL is NOT here on purpose. It is a CMake C++ library with no
  # Package.swift, so declaring it as a Swift package makes SPM resolution fail
  # for the whole project — including the app and its tests, which have nothing
  # to do with the driver.
  #
  # It is vendored instead: a git submodule at driver/vendor/libASPL, compiled
  # straight into the StreamitAudioDriver target (see that target's sources).
  # Fresh clones need: git submodule update --init

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "26"
    DEVELOPMENT_TEAM: "" # <- set your team id here or in Xcode signing.

targets:

  # ---------------------------------------------------------------------------
  # iPhone / iPad app
  # ---------------------------------------------------------------------------
  HearIt:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.voiceinbox
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/VoiceInbox.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (iPad uses a dedicated split layout; UIRequiresFullScreen opts out of multitasking so all-orientations isn't required)
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # Tell the asset-catalog compiler which set is the app icon; without this
        # no icon (or CFBundleIconName) is emitted and App Store upload fails.
        # This is the default (Release / TestFlight / App Store) icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local Debug builds use a distinct icon (AppIcon-Dev) so they're easy to
        # tell apart from the TestFlight build on the home screen. Release inherits
        # the base "AppIcon" above.
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
    dependencies:
      - target: VoiceInboxWatch
        embed: true
      - target: ShareExtension
        embed: true

  # ---------------------------------------------------------------------------
  # Share Extension: save web links from Safari/Feedly to listen offline
  # ---------------------------------------------------------------------------
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Compile just the minimal shared sources the extension needs (it only
      # writes a pending stub to the app group; no fetch/extract/UI).
      - path: Shared/Services/AppGroup.swift
      - path: Shared/Services/JSONCoders.swift
      - path: Shared/Services/SavedArticleStorage.swift
      - path: Shared/Models/SavedArticle.swift
      - path: Shared/Models/Email.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.voiceinbox.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # ---------------------------------------------------------------------------
  # Apple Watch app (modern single-target watchOS app)
  # ---------------------------------------------------------------------------
  VoiceInboxWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.voiceinbox.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/VoiceInboxWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        # Watch app icon (required for embedding + App Store validation).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---------------------------------------------------------------------------
  # streamit — macOS live-streaming studio (virtual camera + virtual mic)
  # ---------------------------------------------------------------------------
  Streamit:
    type: application
    platform: macOS
    sources:
      - path: Mac
    dependencies:
      - package: LiveKit
      - package: KeyboardShortcuts
      - package: WhisperKit
      # scripts/dev-app-only.sh comments the marked block below out, so the app
      # builds without Developer ID certs or a vendored libASPL. Both marker
      # lines must stay, and nothing but dependency entries may go between them.
      # dev-app-only:begin
      - target: CameraExtension
        embed: true          # XcodeGen embeds system-extension deps in
                             # Contents/Library/SystemExtensions; verify on
                             # first `xcodegen generate` (see docs/DEV_SETUP.md).
      - target: StreamitAudioDriver
        embed: true
        codeSign: true
        copy:
          destination: resources   # install payload copied to /Library/Audio/Plug-Ins/HAL by DriverInstaller
      # dev-app-only:end
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.streamit
        # The brand is lowercase, so the bundle is streamit.app and the menu
        # bar reads "streamit" (Info.plist's CFBundleName is $(PRODUCT_NAME)).
        # PRODUCT_MODULE_NAME must be set alongside it: the Swift module name
        # otherwise follows PRODUCT_NAME, and `import streamit` in the tests
        # would be both ugly and a silent rename of the module.
        PRODUCT_NAME: streamit
        PRODUCT_MODULE_NAME: Streamit
        INFOPLIST_FILE: Mac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mac/Resources/Streamit.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES      # Developer ID + notarization; app is NOT sandboxed
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Unit tests for streamit's pure logic (EDL arithmetic, transcript
  # alignment, drift fitting, ring buffer, Codable round-trips). No hardware,
  # no network — runnable with Cmd-U or `xcodebuild test -scheme Streamit`.
  StreamitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/StreamitTests
    dependencies:
      - target: Streamit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.streamit.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST from the host *target* name, which would
        # be Streamit.app/Contents/MacOS/Streamit. The app overrides
        # PRODUCT_NAME to the lowercase brand, so the real product is
        # streamit.app/Contents/MacOS/streamit and the derived path points at
        # nothing. These two must track the app target's PRODUCT_NAME above.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/streamit.app/Contents/MacOS/streamit
        BUNDLE_LOADER: $(TEST_HOST)

  # CoreMediaIO camera extension — publishes the "streamit Camera" that Zoom /
  # Meet / Teams list. Sandboxed (mandatory for CMIO extensions).
  CameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.streamit.cameraextension
        INFOPLIST_FILE: CameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES

  # CoreAudio HAL AudioServerPlugIn (virtual microphone + guest-send loopback
  # devices). Built as a .driver bundle, shipped inside the app's Resources,
  # installed to /Library/Audio/Plug-Ins/HAL on first run (admin prompt).
  StreamitAudioDriver:
    type: bundle
    platform: macOS
    sources:
      - path: driver/StreamitAudio
      # libASPL is vendored as a git submodule (driver/vendor/libASPL) — it
      # is CMake-based with no Package.swift, so it can't be an SPM package
      # (see the packages note above). All its generated sources are
      # committed upstream, so compiling src/ directly needs no CMake step.
      # After cloning this repo: git submodule update --init
      - path: driver/vendor/libASPL/src
        excludes:
          - "*.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.streamit.audiodriver
        PRODUCT_NAME: StreamitAudio
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: driver/StreamitAudio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - driver/vendor/libASPL/include
          - driver/vendor/libASPL/src

# Declare schemes explicitly so regenerating the project always keeps a
# runnable scheme for the app (and the watch) — Xcode's auto-created schemes
# don't survive `xcodegen generate`.
schemes:
  HearIt:
    build:
      targets:
        HearIt: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VoiceInboxWatch:
    build:
      targets:
        VoiceInboxWatch: all
    run:
      config: Debug
    archive:
      config: Release

  Streamit:
    build:
      targets:
        Streamit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreamitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

