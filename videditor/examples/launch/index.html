<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch day</title>
<link rel="stylesheet" href="dugma-motion.css">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: -apple-system, Inter, Helvetica, Arial, sans-serif; color: #fff; }
  .clip { position: absolute; }
  #bg { inset: 0; background: linear-gradient(135deg, hsl(200 60% 25%), hsl(260 70% 45%)); }
  #mark { left: 590px; top: 310px; width: 100px; height: 100px; border-radius: 24px; background: #ffd166; animation: pop .7s cubic-bezier(.2,1.4,.3,1) both, fade .4s 1.6s both; }
  #title { left: 0; right: 0; top: 290px; text-align: center; font-size: 96px; font-weight: 800; letter-spacing: -0.02em; margin: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  #tagline { left: 0; right: 0; top: 410px; text-align: center; font-size: 32px; opacity: .85; margin: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  #cta { left: 540px; top: 520px; width: 200px; padding: 14px 0; text-align: center; border-radius: 999px; background: #ffd166; color: #1a1500; font-weight: 700; font-size: 24px; animation: pop .5s cubic-bezier(.2,1.4,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 0; } }
</style>
</head>
<body>
<div id="stage" data-composition-id="launch" data-start="0" data-duration="6" data-width="1280" data-height="720" data-fps="30">
  <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
  <div id="mark" class="clip" data-start="0.2" data-duration="2" data-track-index="1"></div>
  <h1 id="title" class="clip" data-start="2.2" data-duration="3.8" data-track-index="2">Launch day</h1>
  <p id="tagline" class="clip" data-start="3" data-duration="3" data-track-index="2">Review less. Ship more.</p>
  <div id="cta" class="clip" data-start="4.2" data-duration="1.8" data-track-index="3">Try it</div>
  <audio id="music" data-start="0" data-duration="6" data-track-index="4" data-volume="0.5" src="assets/music.wav"></audio>
</div>
</body>
</html>
